<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teamwork Chat</title>
  <meta name="description" content="Premium real-time two-person chat application with rich media, reactions, and themes." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-container">

    <!-- ═══════════ JOIN SCREEN ═══════════ -->
    <div id="join-screen">
      <div class="join-card">
        <div class="join-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="14" fill="url(#logoGrad)"/>
            <path d="M14 20c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2h-4l-4 4-4-4h-4c-1.1 0-2-.9-2-2v-8z" fill="white" opacity="0.95"/>
            <circle cx="20" cy="24" r="1.5" fill="url(#logoGrad)"/>
            <circle cx="24" cy="24" r="1.5" fill="url(#logoGrad)"/>
            <circle cx="28" cy="24" r="1.5" fill="url(#logoGrad)"/>
            <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#00d4aa"/><stop offset="1" stop-color="#0099ff"/></linearGradient></defs>
          </svg>
        </div>
        <h2>Teamwork Chat</h2>
        <p class="join-subtitle">Private • Encrypted • Just You Two</p>
        <input id="username-input" placeholder="Your name" maxlength="20" autocomplete="off" />
        <input id="code-input" placeholder="Access code" type="password" autocomplete="off" />
        <button id="join-btn">
          <span>Join Chat</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <p id="join-error"></p>
      </div>
    </div>

    <!-- ═══════════ CHAT SCREEN ═══════════ -->
    <div id="chat-screen" style="display:none;">

      <!-- Header -->
      <header id="chat-header">
        <div class="header-left">
          <div class="header-avatar" id="partner-avatar">?</div>
          <div class="header-info">
            <span id="status">Connecting...</span>
            <span id="presence-info">Waiting for partner...</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="header-btn" id="search-toggle-btn" title="Search messages (Ctrl+F)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          </button>
          <button class="header-btn" id="mute-btn" title="Toggle notification sounds">
            <svg id="sound-on-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>
            <svg id="sound-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
          <button class="header-btn" id="theme-btn" title="Change theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
          <button class="header-btn" id="wallpaper-btn" title="Change wallpaper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>

        <!-- Theme Dropdown -->
        <div class="dropdown-menu" id="theme-dropdown">
          <button class="dropdown-item" data-theme="dark"><span class="theme-swatch dark-swatch"></span> Dark</button>
          <button class="dropdown-item" data-theme="light"><span class="theme-swatch light-swatch"></span> Light</button>
          <button class="dropdown-item" data-theme="purple"><span class="theme-swatch purple-swatch"></span> Midnight Purple</button>
        </div>

        <!-- Wallpaper Dropdown -->
        <div class="dropdown-menu" id="wallpaper-dropdown">
          <button class="dropdown-item" data-wallpaper="none">None</button>
          <button class="dropdown-item" data-wallpaper="dots">Subtle Dots</button>
          <button class="dropdown-item" data-wallpaper="doodles">Chat Doodles</button>
          <button class="dropdown-item" data-wallpaper="geometric">Geometric</button>
          <button class="dropdown-item" data-wallpaper="mesh">Gradient Mesh</button>
        </div>
      </header>

      <!-- Search Bar -->
      <div id="search-bar" class="search-bar hidden">
        <div class="search-inner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input id="search-input" placeholder="Search messages..." autocomplete="off" />
          <span id="search-count"></span>
          <button class="search-nav-btn" id="search-prev" title="Previous">▲</button>
          <button class="search-nav-btn" id="search-next" title="Next">▼</button>
          <button class="search-close-btn" id="search-close" title="Close">✕</button>
        </div>
      </div>

      <!-- Connection Status Dot -->
      <div class="connection-status-dot" id="status-dot"></div>

      <!-- Messages Area -->
      <div id="messages"></div>

      <!-- Unread Badge -->
      <div id="unread-badge" class="unread-badge hidden">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        <span id="unread-count">0</span> new messages
      </div>

      <!-- Drag & Drop Overlay -->
      <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-content">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          <p>Drop files here</p>
        </div>
      </div>

      <!-- Reply Preview Bar -->
      <div id="reply-bar" class="reply-bar hidden">
        <div class="reply-preview">
          <div class="reply-accent"></div>
          <div class="reply-info">
            <span class="reply-name" id="reply-name"></span>
            <span class="reply-text" id="reply-text"></span>
          </div>
        </div>
        <button class="reply-close" id="reply-close">✕</button>
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator"></div>

      <!-- Input Area -->
      <div id="input-area">
        <button class="input-action-btn" id="attach-btn" title="Attach file">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden />

        <div class="textarea-wrapper">
          <textarea id="message-input" placeholder="Type a message..." maxlength="5000" rows="1" autocomplete="off"></textarea>
        </div>

        <button class="input-action-btn" id="gif-btn" title="GIFs & Stickers">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>

        <button class="input-action-btn" id="voice-btn" title="Record voice message">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>

        <button class="send-btn" id="send-btn" title="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

      <!-- Voice Recording Bar -->
      <div id="voice-bar" class="voice-bar hidden">
        <div class="voice-recording-indicator">
          <span class="recording-dot"></span>
          <span id="voice-timer">0:00</span>
        </div>
        <div id="voice-waveform" class="voice-waveform"></div>
        <button class="voice-cancel-btn" id="voice-cancel">✕ Cancel</button>
        <button class="voice-send-btn" id="voice-send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send
        </button>
      </div>

      <!-- GIF & Sticker Panel -->
      <div id="media-panel" class="media-panel hidden">
        <div class="media-panel-header">
          <div class="media-tabs">
            <button class="media-tab active" data-tab="stickers">😄 Stickers</button>
            <button class="media-tab" data-tab="gifs">GIF</button>
          </div>
          <button class="media-panel-close" id="media-panel-close">✕</button>
        </div>
        <div class="media-panel-search">
          <input id="media-search" placeholder="Search..." autocomplete="off" />
        </div>
        <div class="media-panel-content" id="sticker-grid">
          <!-- Populated by JS -->
        </div>
        <div class="media-panel-content hidden" id="gif-grid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Message Context Menu -->
      <div id="context-menu" class="context-menu hidden">
        <button class="context-item" id="ctx-reply">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/></svg>
          Reply
        </button>
        <button class="context-item" id="ctx-react">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          React
        </button>
        <button class="context-item ctx-danger" id="ctx-delete">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          Delete
        </button>
      </div>

      <!-- Reaction Picker -->
      <div id="reaction-picker" class="reaction-picker hidden">
        <button class="reaction-btn" data-emoji="❤️">❤️</button>
        <button class="reaction-btn" data-emoji="😂">😂</button>
        <button class="reaction-btn" data-emoji="😮">😮</button>
        <button class="reaction-btn" data-emoji="😢">😢</button>
        <button class="reaction-btn" data-emoji="👍">👍</button>
        <button class="reaction-btn" data-emoji="🔥">🔥</button>
      </div>

      <!-- Image Lightbox -->
      <div id="lightbox" class="lightbox hidden">
        <button class="lightbox-close" id="lightbox-close">✕</button>
        <img id="lightbox-img" src="" alt="Full size image" />
      </div>

      <!-- Toast Container -->
      <div id="toast-container"></div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
